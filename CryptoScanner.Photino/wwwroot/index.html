<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>CryptoScanBot</title>
    <link href="_content/CryptoScanner.UI/css/app.css" rel="stylesheet" />
    <style>
        /* Follow the theme instead of hardcoding dark. app.css defines these on :root, so the body
           no longer paints black behind a light-theme layout. */
        body { background: var(--bg-base, #000); color: var(--text-primary, #e0e0e0); }
    </style>
</head>
<body>
    <app>Loading...</app>

    <script src="_framework/blazor.webview.js"></script>
    <!-- Loaded with the start time behind them, so the webview cannot serve a script from an
         earlier run. Without that a rebuilt .js file silently keeps its old behaviour while the
         C# half is new: on 16-09-2026 that cost an afternoon of chasing a chart bug that had
         already been fixed on disk. document.write keeps them in this exact order, which matters -
         they register themselves before Blazor starts talking to them. -->
    <script>
        (function () {
            var v = Date.now();
            var files = ['theme-interop', 'popup-interop', 'dialog-window', 'number-input',
                         'grid-interop', 'tradingview-widget', 'chart-widget'];
            for (var i = 0; i < files.length; i++)
                document.write('<scr' + 'ipt src="_content/CryptoScanner.UI/js/' + files[i] + '.js?v=' + v + '"></scr' + 'ipt>');
        })();
    </script>
</body>
</html>
