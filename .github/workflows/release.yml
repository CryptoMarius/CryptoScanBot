# =================================================================================================
#  Builds the three release packages on GitHub, the same way publish-release.cmd builds them on the
#  development machine:
#
#    CryptoScanBot-<version>-win-x64.zip    scanner + emulator + Photino + web, Windows
#    CryptoScanBot-<version>-osx-arm64.zip  scanner + emulator + Photino + web, Apple Silicon
#    CryptoScanBot-<version>-linux-x64.zip  scanner + emulator + Photino + web, Linux (glibc, x64)
#
#  It runs on a Windows runner and uses the same commands as the local script, including the
#  tar.exe that ships with Windows, so the packages are built the way they have always been built.
#  The ordering trap is the same one the local script documents: Photino has to land ON TOP of the
#  scanner folder, because two files exist in both publishes with different versions and the
#  Photino ones are the ones all three .deps.json files ask for. The web host is merged in between,
#  for that same reason: it may not be the last one in.
#
#  Three deviations from the local script, all on purpose:
#    - The package folder is deleted after it has been zipped. A runner has far less disk than a
#      development machine and three unpacked packages plus their zips do not fit comfortably.
#    - The local tags are dropped after checkout (see the step itself for why).
#    - The patched Photino.Native.dll is built here from the upstream source instead of taken from
#      Tools\PhotinoNative, so every file in the package comes out of this build.
#
#  Started by pushing a version tag (2.6.8), or by hand from the Actions tab. A tag run also
#  attaches the three zips to the GitHub release of that tag; a manual run only leaves them as
#  workflow artifacts.
#
#  This workflow is what makes the build verifiable for a third party: anyone can see which commit
#  produced which zip. That is also what SignPath Foundation asks for. The signing steps are in
#  place but dormant: they submit the packages to SignPath.io only when the credentials for it are
#  configured, and until the certificate has been granted they are not - so a release comes out
#  unsigned instead of failing.
# =================================================================================================

name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      sign:
        description: 'Submit the packages to SignPath (a tag run always does)'
        type: boolean
        default: false

permissions:
  contents: write
  # The signing action reads the run it is part of and downloads the artifact it submits.
  actions: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Drop the local tags
        shell: pwsh
        run: |
          # The build stamp in Directory.Build.props runs "git describe --always --dirty". With a
          # tag in reach that returns the tag instead of a commit hash, so the About box would read
          # "2.6.8+2.6.8" - a version number twice instead of the commit that produced the build.
          # Without local tags describe falls back to the hash, exactly like a build on the
          # development machine. The release step below uses the tag from GITHUB_REF_NAME, so
          # nothing else depends on the tags being here.
          git tag -l | ForEach-Object { git tag -d $_ } | Out-Null

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # The development machine builds these net8.0 projects with the .NET 10 SDK, so the
          # runner uses the same one. Pin this to an exact version (10.0.401) if a build has to be
          # reproducible down to the SDK patch level.
          dotnet-version: '10.0.x'

      - name: Read the version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          # The version lives in exactly one place. A second copy here would drift the moment one of
          # the two is bumped and the other is not, and the zip would name a version that the
          # binaries inside it do not carry.
          $props = Get-Content Directory.Build.props -Raw
          if ($props -notmatch '<Version>([^<]+)</Version>') {
            Write-Error 'Could not read <Version> from Directory.Build.props'
            exit 1
          }
          $version = $Matches[1].Trim()
          Write-Host "Version $version"
          # -Encoding utf8 on purpose: without it Out-File writes UTF-16 on Windows PowerShell and
          # the runner reads the output as "v e r s i o n = ...". pwsh defaults to UTF-8, but a
          # value that only works because of a default is a value waiting to break.
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # A tag run must name the version that is actually in the sources. Without this check a
          # tag 2.6.8 on a tree that still says 2.6.7 would quietly produce 2.6.7 packages under a
          # 2.6.8 release.
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match <Version> $version in Directory.Build.props"
            exit 1
          }

      # The Photino window leaks one UTF-16 copy of every render batch in Photino.Native 4.0.22, so
      # the Windows package carries a patched build of that dll. Tools\PhotinoNative holds the patch,
      # the upstream commit it applies to and a script that builds it on a development machine, and a
      # copy of the built dll is committed there as well so that a developer without the C++ workload
      # can still build the scanner. That committed copy is the one file in the package the build
      # system cannot account for, which is exactly what a package signed by SignPath Foundation
      # should not contain, so the runner throws it away and builds the dll from source itself.
      #
      # A failure here fails the workflow instead of quietly falling back to the dll from the NuGet
      # package. That one still has the leak, and a release that grows 30 to 50 MB per hour is worse
      # than a release that is a day late.
      #
      # Only the Windows package uses it: CryptoScanner.Photino.csproj copies the file for an empty
      # or win-x64 RuntimeIdentifier, so the macOS and Linux publishes below are untouched.
      - name: Build the patched Photino.Native.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # The commit the patch was written against (see Tools\PhotinoNative\README.md). Pinned on
          # purpose: the patch is a diff against these exact lines and upstream master moves.
          $upstream = '3986d60'
          $src = Join-Path $env:RUNNER_TEMP 'photino.Native'
          $tools = Join-Path $env:GITHUB_WORKSPACE 'Tools\PhotinoNative'

          # The dll is a tracked file, so replacing it makes the working tree dirty, and the build
          # stamp in Directory.Build.props runs "git describe --always --dirty". Without this the
          # About box of an official release would read "2.6.7+a1b2c3d4-dirty", which claims the
          # build came from edited sources. --assume-unchanged hides this one file from git; it
          # changes nothing in the repository and lives only on the runner.
          git update-index --assume-unchanged Tools/PhotinoNative/Photino.Native.dll
          if ($LASTEXITCODE -ne 0) { throw 'could not hide the committed dll from git' }

          # The committed dll goes first, so no later step can pick it up by accident.
          Remove-Item (Join-Path $tools 'Photino.Native.dll') -Force

          git clone --quiet https://github.com/tryphotino/photino.Native.git $src
          if ($LASTEXITCODE -ne 0) { throw 'could not clone photino.Native' }
          git -C $src checkout --quiet $upstream
          if ($LASTEXITCODE -ne 0) { throw "could not check out $upstream" }
          git -C $src apply --whitespace=nowarn (Join-Path $tools 'photino-native-webmessage-leak.patch')
          if ($LASTEXITCODE -ne 0) { throw 'the patch did not apply - did upstream change?' }

          # vswhere instead of a hard coded path: the runner image decides which Visual Studio it
          # carries, and it is not the one the local build script points at.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'this runner has no Visual Studio with the C++ tools' }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { throw "no MSBuild at $msbuild" }

          # packages.config, not PackageReference: the vcxproj imports the WebView2 and WIL targets
          # from ..\packages\<Id>.<Version>\build. nuget.exe restore -PackagesDirectory writes
          # exactly that layout; an msbuild restore drops them in the global packages folder, where
          # the project does not look - the same trap the local build script works around.
          if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) { throw 'nuget.exe is not on the path of this runner' }
          & nuget restore (Join-Path $src 'Photino.Native\packages.config') -PackagesDirectory (Join-Path $src 'packages') -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'restore of the native packages failed' }

          # The project asks for toolset v143 (Visual Studio 2022). Try that first and fall back to
          # v145, the same order the local script uses, so a newer image still builds.
          $vcxproj = Join-Path $src 'Photino.Native\Photino.Native.vcxproj'
          & $msbuild $vcxproj -p:Configuration=Release -p:Platform=x64 -v:m
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Toolset v143 not available, retrying with v145 ...'
            & $msbuild $vcxproj -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v145 -v:m
            if ($LASTEXITCODE -ne 0) { throw 'the native build of Photino.Native failed' }
          }

          $built = Join-Path $src 'Photino.Native\x64\Release\Photino.Native.dll'
          if (-not (Test-Path $built)) { throw 'the native build produced no dll' }
          Copy-Item $built (Join-Path $tools 'Photino.Native.dll') -Force
          Write-Host "Photino.Native.dll built from $upstream ($([math]::Round((Get-Item $built).Length / 1KB)) KB)"

      - name: Build the packages
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $env:GITHUB_WORKSPACE 'build'
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'

          foreach ($rid in 'win-x64', 'osx-arm64', 'linux-x64') {
            Write-Host "=== CryptoScanBot $env:VERSION $rid (scanner + emulator + Photino + web) ==="

            $package = Join-Path $publishDir "CryptoScanBot-$env:VERSION-$rid"
            $web     = Join-Path $publishDir "web-tmp-$rid"
            $photino = Join-Path $publishDir "photino-tmp-$rid"
            $zip     = "$package.zip"

            # The scanner csproj has a BundleEmulatorIntoPublish target, so CryptoScanBot.Emulator
            # lands in the same folder - it does not need its own publish command here.
            dotnet publish CryptoScanner\CryptoScanner.csproj -c Release -r $rid --self-contained true -o $package --nologo -v minimal
            if ($LASTEXITCODE -ne 0) { throw "publish of the scanner failed for $rid" }

            # The web host serves the same Blazor screens as Photino, but over http. It is merged in
            # the same way and BEFORE Photino, so Photino keeps the last word over the two files
            # described below. It brings the ASP.NET Core assemblies, which nothing else here has.
            dotnet publish CryptoScanner.Web\CryptoScanner.Web.csproj -c Release -r $rid --self-contained true -o $web --nologo -v minimal
            if ($LASTEXITCODE -ne 0) { throw "publish of the web host failed for $rid" }

            & xcopy "$web\*" "$package\" /e /y /r /q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "merging the web host into the package failed for $rid" }
            Remove-Item -Path $web -Recurse -Force

            dotnet publish CryptoScanner.Photino\CryptoScanner.Photino.csproj -c Release -r $rid --self-contained true -o $photino --nologo -v minimal
            if ($LASTEXITCODE -ne 0) { throw "publish of Photino failed for $rid" }

            # Photino ON TOP of the scanner, overwriting unconditionally. Publishing it straight
            # into the scanner folder does NOT do that: publish keeps whatever file has the newest
            # timestamp, so the newer assembly was silently skipped. xcopy /y does not care about
            # timestamps, which is the whole point. It is also the reason this is not Copy-Item:
            # Copy-Item -Recurse puts a subfolder that exists on both sides (wwwroot) INSIDE the
            # existing one instead of merging it, xcopy merges.
            & xcopy "$photino\*" "$package\" /e /y /r /q | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "merging Photino into the package failed for $rid" }
            Remove-Item -Path $photino -Recurse -Force

            # 80 MB of native Skia symbols that never help with our own exceptions. The debug
            # symbols of our own assemblies are kept, so a stack trace from a user's log still
            # carries file names and line numbers.
            $skiaPdb = Join-Path $package 'libSkiaSharp.pdb'
            if (Test-Path $skiaPdb) { Remove-Item $skiaPdb -Force }

            # The tar.exe that ships with Windows (bsdtar) writes forward slashes in the zip, which
            # matters for the macOS package: a zip made by Explorer or PowerShell 5.1 stores
            # backslashes and unpacks into a mess on a Mac.
            & $tar -a -c -f $zip -C $publishDir "CryptoScanBot-$env:VERSION-$rid"
            if ($LASTEXITCODE -ne 0) { throw "zipping failed for $rid" }

            # Disk on a runner is limited, and the zip is the only thing that still has to travel.
            Remove-Item -Path $package -Recurse -Force

            Write-Host "$zip is ready ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"
          }

      # One artifact per package, not one artifact holding all three. upload-artifact packs
      # everything it is given into a single archive, so a step per package is what keeps the three
      # zips separately downloadable instead of one bundle of a quarter of a gigabyte that has to be
      # unpacked before you can get at the one you need.
      #
      # archive: false uploads the zip as it is, instead of packing it into a second zip. That
      # double wrapper is why a downloaded artifact first unpacked into another
      # CryptoScanBot-<version>-<rid>.zip before the package itself came into view. It only works
      # for a single file per step, which is exactly what these steps upload, and the artifact is
      # then named after the file - the name input is ignored in that mode, so it is left out
      # here. compression-level is gone for the same reason: without an archive there is nothing
      # left to compress.
      #
      # This only matters for a manual run. On a tag run the three zips are attached to the release
      # itself, and there they are separate files regardless.
      - name: Keep the Windows package as an artifact
        id: upload-win
        uses: actions/upload-artifact@v7
        with:
          path: build/CryptoScanBot-${{ steps.version.outputs.version }}-win-x64.zip
          archive: false
          retention-days: 14

      - name: Keep the macOS package as an artifact
        id: upload-osx
        uses: actions/upload-artifact@v7
        with:
          path: build/CryptoScanBot-${{ steps.version.outputs.version }}-osx-arm64.zip
          archive: false
          retention-days: 14

      - name: Keep the Linux package as an artifact
        id: upload-linux
        uses: actions/upload-artifact@v7
        with:
          path: build/CryptoScanBot-${{ steps.version.outputs.version }}-linux-x64.zip
          archive: false
          retention-days: 14

      # ===============================================================================================
      #  Signing by SignPath.io
      #
      #  The three packages go up one by one: a signing request covers one artifact, and every
      #  request is approved by hand. SignPath does not receive the file from this workflow, it
      #  fetches the artifact from the run itself - which is why the upload steps above have to come
      #  first and why they are not there for convenience alone.
      #
      #  Nothing here happens until four values are in place: the api token as a repository secret
      #  and the three names as repository variables.
      #
      #    secret  SIGNPATH_API_TOKEN
      #    var     SIGNPATH_ORGANIZATION_ID
      #    var     SIGNPATH_PROJECT_SLUG
      #    var     SIGNPATH_SIGNING_POLICY_SLUG
      #
      #  Until the certificate of the SignPath Foundation has been granted they are not, the steps
      #  are skipped, and the release comes out unsigned - a release that is late is worse than a
      #  release that is not signed yet.
      # ===============================================================================================
      - name: Is signing configured?
        id: signing
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          # Four values that all have to be there, read by three steps. Answered once here so the
          # three cannot disagree, and named one by one so the log says what is missing instead of
          # only that something is.
          $missing = @()
          if (-not $env:SIGNPATH_API_TOKEN) { $missing += 'secret SIGNPATH_API_TOKEN' }
          if (-not $env:SIGNPATH_ORGANIZATION_ID) { $missing += 'variable SIGNPATH_ORGANIZATION_ID' }
          if (-not $env:SIGNPATH_PROJECT_SLUG) { $missing += 'variable SIGNPATH_PROJECT_SLUG' }
          if (-not $env:SIGNPATH_SIGNING_POLICY_SLUG) { $missing += 'variable SIGNPATH_SIGNING_POLICY_SLUG' }

          if ($missing.Count -eq 0) {
            Write-Host 'SignPath is configured, the packages will be submitted for signing.'
            'configured=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          else {
            Write-Host "::notice::Not signing, $($missing -join ' and ') not set. The packages stay unsigned."
            'configured=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      # A tag run signs, a manual run only when it was started with the sign box ticked. Signing a
      # package nobody will publish costs an approval and half an hour of waiting, so it is not what
      # a manual run should do by default.
      - name: Sign the Windows package
        if: steps.signing.outputs.configured == 'true' && (github.ref_type == 'tag' || inputs.sign)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-win.outputs.artifact-id }}
          # The artifact IS the zip, not a zip around it, because the upload steps above pass
          # archive: false. Without this the action would unpack the signed package over the output
          # folder instead of leaving the zip whole.
          skip-decompress: true
          wait-for-completion: true
          # A signing request waits for a human, so the wait is measured in minutes. The default of
          # ten is short enough to lose a release over a cup of coffee.
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed

      - name: Sign the macOS package
        if: steps.signing.outputs.configured == 'true' && (github.ref_type == 'tag' || inputs.sign)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-osx.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed

      - name: Sign the Linux package
        if: steps.signing.outputs.configured == 'true' && (github.ref_type == 'tag' || inputs.sign)
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-linux.outputs.artifact-id }}
          skip-decompress: true
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed

      - name: Attach the packages to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME

          # The release is usually created by hand, with the release notes in it. Only create one
          # when it is not there yet, so notes that are already written are never overwritten.
          # A release page is one of the two pages that has to carry the code signing policy; the
          # other is the repository home page, where the README shows it. The terms allow a link
          # instead of the whole section, which is what this is. A release written by hand needs
          # the same line pasted into its notes.
          $policy = 'Code signing policy: see the [code signing policy](https://github.com/CryptoMarius/CryptoScanBot#code-signing-policy) in the README.'

          # The notes of a release the workflow creates itself come from Release Changes.txt in the
          # repository root. Its blocks open with a header line "DD-MM-YYYY <version>" and run until
          # the next header, so the block for this tag is everything in between. The header carries a
          # date as well, and that date is not always the day of the release, so the version at the
          # end of the line decides - never the date.
          #
          # When no block is found the notes fall back to the policy line alone and the run gets a
          # warning. A thin release note is a small problem; a release carrying the changelog of
          # another version is a large one.
          $notes = $policy
          $changelog = Join-Path $env:GITHUB_WORKSPACE 'Release Changes.txt'
          if (Test-Path $changelog) {
            $lines = Get-Content $changelog -Encoding utf8
            $headerPattern = '^\d{2}-\d{2}-\d{4}\s+[\d.]+\s*$'
            $tagPattern = '\s' + [regex]::Escape($tag) + '$'
            $start = -1
            $end = $lines.Count
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -notmatch $headerPattern) { continue }
              if ($start -lt 0) {
                if ($lines[$i].Trim() -match $tagPattern) { $start = $i }
              }
              else {
                $end = $i
                break
              }
            }
            if ($start -ge 0) {
              $block = ($lines[$start..($end - 1)] -join "`n").TrimEnd()
              $notes = $block + "`n`n" + $policy
              Write-Host "Release notes taken from Release Changes.txt, $($end - $start) lines"
            }
            else {
              Write-Host "::warning::Release Changes.txt has no block for $tag; the release gets the policy line only"
            }
          }
          else {
            Write-Host "::warning::Release Changes.txt not found; the release gets the policy line only"
          }

          # --notes-file rather than --notes: the changelog holds quotes and brackets, and a command
          # line is the wrong place to find out which of them the shell wants to interpret.
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "could not create the release for $tag" }
          }

          # The signed packages when the signing steps ran, the ones straight from the build
          # otherwise. Both folders carry the same three names, so the upload below does not care
          # which of the two it gets.
          $source = Join-Path $env:GITHUB_WORKSPACE 'signed'
          if (-not (Test-Path (Join-Path $source '*.zip'))) { $source = Join-Path $env:GITHUB_WORKSPACE 'build' }
          Write-Host "Uploading the packages from $source"

          # --clobber so a rerun of the workflow replaces the assets instead of failing on them.
          $zips = Get-ChildItem $source -Filter *.zip | ForEach-Object { $_.FullName }
          gh release upload $tag @zips --clobber
          if ($LASTEXITCODE -ne 0) { throw "could not upload the packages to $tag" }
